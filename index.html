<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETMO-DECODE: 語源解碼探案 MVP</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-light: #f8fafc;
            --correct: #22c55e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            border: 1px solid #334155;
        }
        .tag {
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 12px;
        }
        h1 { font-size: 1.5rem; margin-top: 0; }
        .root-box {
            background: #090d16;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            margin-bottom: 20px;
        }
        .clue-title { font-size: 0.9rem; color: #94a3b8; }
        .root-name { font-size: 1.4rem; color: #f43f5e; font-weight: bold; }
        .options { display: grid; gap: 10px; margin-top: 20px; }
        button {
            background: #334155;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        button:hover { background: #475569; }
        .success-message {
            display: none;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid var(--correct);
            color: #4ade80;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <span class="tag">ETMO-DECODE 語源解碼遊戲 MVP</span>
    <h1>關卡 01：解碼「觀察者」的秘密</h1>
    
    <div class="root-box">
        <div class="clue-title">原始日耳曼語根 (Proto-Germanic / PIE)</div>
        <div class="root-name">*spek- / *skowwōna (原意：看、觀察)</div>
    </div>

    <p><strong>【探案任務】</strong> 根據底層語根「看（*spek-）」，加上拉丁Prefix「retro-（向後）」，推導出下列哪一個單字代表<b>「回顧的、懷舊的」</b>？</p>

    <div class="options">
        <button onclick="checkAnswer(false)">A. Prospective (pro- 向前 + spect 看)</button>
        <button onclick="checkAnswer(true)">B. Retrospective (retro- 向後 + spect 看)</button>
        <button onclick="checkAnswer(false)">C. Introspective (intro- 向內 + spect 看)</button>
    </div>

    <div id="result" class="success-message">
        🎉 <b>解碼成功！</b><br>
        • <b>Retro-</b> (向後) + <b>spect</b> (看) + <b>-ive</b> (形容詞) ＝ 往回看的 ➔ <b>回顧的</b>。<br>
        掌握 1 個語根，即可瞬間解鎖大考 15 個核心單字！
    </div>
</div>

<script>
    function checkAnswer(isCorrect) {
        if(isCorrect) {
            document.getElementById('result').style.display = 'block';
        } else {
            alert('❌ 密碼錯誤！提示：尋找代表「向後看」的 Prefix (前綴)。');
        }
    }
</script>

</body>
</html>
