<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETMO-DECODE: 100 關語源解碼遊戲引擎</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-light: #f8fafc;
            --correct: #22c55e;
            --wrong: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            border: 1px solid #334155;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .progress { font-size: 0.85rem; color: #94a3b8; }
        .root-box {
            background: #090d16;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            margin: 12px 0;
        }
        .clue-title { font-size: 0.8rem; color: #94a3b8; }
        .root-name { font-size: 1.2rem; color: #f43f5e; font-weight: bold; margin-top: 2px; }
        .question-text {
            font-size: 1rem;
            line-height: 1.5;
            margin: 15px 0;
        }
        .options { display: grid; gap: 10px; margin-top: 15px; }
        button {
            background: #334155;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            line-height: 1.4;
            white-space: normal;
            word-break: break-word;
        }
        button:hover { background: #475569; }
        .explanation {
            display: none;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--correct);
            color: #4ade80;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .next-btn {
            display: none;
            width: 100%;
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
        }
        .next-btn:hover { background: #7dd3fc; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="tag">ETMO-DECODE 100 關解碼引擎</span>
        <span class="progress" id="progress">關卡 1 / 100</span>
    </div>
    
    <h2 id="q-title" style="font-size:1.1rem; margin:5px 0; color:#38bdf8;">載入題庫中...</h2>

    <div class="root-box">
        <div class="clue-title">核心語根 (Proto-Germanic / PIE Root)</div>
        <div class="root-name" id="root-display">-</div>
    </div>

    <div class="question-text" id="question-text">-</div>

    <div class="options" id="options-container"></div>

    <div id="explanation-box" class="explanation"></div>
    <button id="next-btn" class="next-btn" onclick="nextQuestion()">進入下一關 ➔</button>
</div>

<script>
    let questions = [];
    let currentIndex = 0;

    // 動態讀取同目錄下的 questions.json
    fetch('questions.json')
        .then(response => {
            if (!response.ok) throw new Error('無法讀取 questions.json');
            return response.json();
        })
        .then(data => {
            questions = data;
            loadQuestion(currentIndex);
        })
        .catch(err => {
            document.getElementById('q-titleinnerText').innerText = '系統初始化失敗';
            document.getElementById('question-text').innerHTML = '⚠️ 請確認 GitHub 根目錄是否已正確放入 <b>questions.json</b> 檔案！';
        });

    function loadQuestion(index) {
        if(index >= questions.length) {
            document.getElementById('progress').innerText = '挑戰完成';
            document.getElementById('q-title').innerText = '🎉 恭喜完成全套 100 關語源解碼挑戰！';
            document.getElementById('root-display').innerText = 'ETMO-DECODE 數位資產認證';
            document.getElementById('question-text').innerHTML = '您已成功掌握 20 個高頻日耳曼語根與 100 個大考核心單字底層邏輯。這套數位資產已準備好對接 B2B 補習班授權與政府雙語教學應用！';
            document.getElementById('options-container').innerHTML = '';
            document.getElementById('explanation-box').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            return;
        }

        const q = questions[index];
        document.getElementById('progress').innerText = `關卡 ${index + 1} / ${questions.length}`;
        document.getElementById('q-title').innerText = `【第 ${index + 1} 關】${q.topic || '單字底層解碼'}`;
        document.getElementById('root-display').innerText = `${q.root} （原意：${q.root_meaning}）`;
        document.getElementById('question-text').innerHTML = q.question;
        
        const optContainer = document.getElementById('options-container');
        optContainer.innerHTML = '';
        
        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.innerHTML = opt.text;
            btn.onclick = () => selectOption(idx, q.correctIndex, q.explanation);
            optContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIdx, correctIdx, expText) {
        const buttons = document.querySelectorAll('#options-container button');
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if(idx === correctIdx) {
                btn.style.background = '#15803d';
                btn.style.color = '#ffffff';
                btn.style.borderColor = '#22c55e';
            } else if(idx === selectedIdx) {
                btn.style.background = '#b91c1c';
                btn.style.color = '#ffffff';
            }
        });

        const expBox = document.getElementById('explanation-box');
        expBox.innerHTML = `<b>【解碼鏈結解析】</b><br>${expText}`;
        expBox.style.display = 'block';

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion(currentIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>

</body>
</html>
